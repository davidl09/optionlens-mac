# electron-builder, one build per OS and architecture (the bundled Python wheels are platform-specific;
# scripts/bundle-engine.sh builds build/python first). Release assets (names: electron/main/updater/asset.ts):
# - macOS: OptionLens.app (`dir`, ad-hoc signed after packing), zipped by scripts/zip-mac-app.sh into
#   OptionLens-<version>-<arch>.zip. install.sh and the in-app updater install from that zip.
# - Windows x64: OptionLens-<version>-win-x64-setup.exe (NSIS, per user, no admin; install.ps1 and the updater
#   run it) and OptionLens-<version>-win-x64.zip (portable folder, updated by hand).
# - Linux x64: OptionLens-<version>-linux-x64.AppImage (install.sh and the updater replace it in place).
appId: app.optionlens.mac   # = APP_ID in electron/main/app-id.ts (bundle id, Windows AppUserModelID)
productName: OptionLens
copyright: OptionLens
directories:
  output: release
  buildResources: build
files:
  - dist/**
  - dist-electron/**
  - resources/**
  - package.json
  - "!**/*.map"
asar: true
afterPack: scripts/after-pack.cjs
# Relocatable CPython with the engine and its locked dependencies (scripts/bundle-engine.sh).
extraResources:
  - from: build/python
    to: python
mac:
  category: public.app-category.finance
  target: dir
  identity: null
  hardenedRuntime: false
  icon: build/icon.png
  # scipy's arm64 wheels need macOS 12.3; scripts/bundle-engine.sh resolves wheels for this version and
  # CI checks every bundled Mach-O against it (scripts/check-macos-minos.py).
  minimumSystemVersion: "12.3"
  extendInfo:
    LSUIElement: false
    NSHumanReadableCopyright: OptionLens
win:
  target: [nsis, zip]
  icon: build/icon.png
  artifactName: OptionLens-${version}-win-x64.${ext}   # x64 builds only (CI)
nsis:
  # One click, per user (%LOCALAPPDATA%\Programs\OptionLens), no elevation; data in %APPDATA%\OptionLens stays
  # on uninstall. The Start-menu shortcut carries the AppUserModelID that notifications need.
  oneClick: true
  perMachine: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: OptionLens
  deleteAppDataOnUninstall: false
  differentialPackage: false
  artifactName: OptionLens-${version}-win-x64-setup.${ext}
linux:
  target: AppImage
  executableName: optionlens
  syncDesktopName: true   # desktopName (package.json) = optionlens.desktop: window ↔ launcher entry (WM_CLASS)
  category: Finance
  icon: build/icon.png
  synopsis: Options and stock analytics with an IBKR bridge
  artifactName: OptionLens-${version}-linux-x64.${ext}   # x64 builds only (CI); the AppImage default would say x86_64
toolsets:
  # The static AppImage runtime (type2-runtime): runs with FUSE 3 or 2 and without libfuse2 installed
  # (Ubuntu 22.04+ no longer installs libfuse2), unlike the legacy runtime.
  appimage: "1.0.3"
