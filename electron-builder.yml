# electron-builder: macOS dmg (unsigned, ad-hoc signed after packing), one per architecture
# (the bundled Python wheels are architecture-specific). Linux `dir` is only for local checks.
appId: app.optionlens.mac
productName: OptionLens
copyright: OptionLens
directories:
  output: release
  buildResources: build
files:
  - dist/**
  - dist-electron/**
  - resources/**
  - package.json
  - "!**/*.map"
asar: true
afterPack: scripts/after-pack.cjs
mac:
  category: public.app-category.finance
  target: dmg
  identity: null
  hardenedRuntime: false
  icon: build/icon.png
  # scipy's arm64 wheels need macOS 12.3; scripts/bundle-engine.sh resolves wheels for this version and
  # CI checks every bundled Mach-O against it (scripts/check-macos-minos.py).
  minimumSystemVersion: "12.3"
  extendInfo:
    LSUIElement: false
    NSHumanReadableCopyright: OptionLens
  # Relocatable CPython with the engine and its locked dependencies (scripts/bundle-engine.sh).
  extraResources:
    - from: build/python
      to: python
dmg:
  artifactName: OptionLens-${version}-${arch}.${ext}
  writeUpdateInfo: false
linux:
  target: dir
  category: Finance
  extraResources:
    - from: build/python
      to: python
