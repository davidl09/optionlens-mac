# electron-builder: macOS dmg (unsigned, ad-hoc signed after packing), one per architecture
# (the bundled Python wheels are architecture-specific). Linux `dir` is only for local checks.
appId: app.optionlens.mac
productName: OptionLens
copyright: OptionLens
directories:
  output: release
  buildResources: build
files:
  - dist/**
  - dist-electron/**
  - resources/**
  - package.json
  - "!**/*.map"
asar: true
afterPack: scripts/after-pack.cjs
mac:
  category: public.app-category.finance
  target: dmg
  identity: null
  hardenedRuntime: false
  icon: build/icon.png
  minimumSystemVersion: "12.0"
  extendInfo:
    LSUIElement: false
    NSHumanReadableCopyright: OptionLens
  # Relocatable CPython + engine dependencies (scripts/bundle-engine.sh) and the engine package.
  extraResources:
    - from: build/python
      to: python
    - from: build/engine
      to: engine
dmg:
  artifactName: OptionLens-${version}-${arch}.${ext}
  writeUpdateInfo: false
linux:
  target: dir
  category: Finance
