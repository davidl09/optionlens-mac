[project]
name = "optionlens"
version = "0.1.28"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "duckdb>=1.1",
  "numpy>=2.0",
  "scipy>=1.13",
  "pyarrow>=26.0.1",
  "tzdata>=2026.6",
  "websockets>=13",
  "mcp>=2.3,<3",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "respx>=0.21"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["optionlens"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
