<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>OptionLens</title>
    <script>
      try { var t = localStorage.getItem("ol-theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; else document.documentElement.dataset.theme = "dark"; } catch (e) { document.documentElement.dataset.theme = "dark"; }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
